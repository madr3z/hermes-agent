<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; font-src 'self'">
<link rel="stylesheet" href="xterm.css"><style>
html,body { margin:0; height:100%; overflow:hidden; background:#101419; color:#fff; font-family:system-ui; }
body { display:flex; flex-direction:column; }
#surface { flex:1; min-height:0; overflow:hidden; touch-action:none; }
#tools { display:flex; gap:5px; overflow-x:auto; padding:8px; flex-shrink:0; }
button { background:#273340; color:white; border:0; border-radius:12px; min-width:44px; min-height:44px; padding:10px 14px; font-size:15px; white-space:nowrap; }
button.selected { background:#246bcc; }
#keyboard { font-size:16px; min-height:44px; resize:none; background:#fff; color:#111; }
.xterm { height:100%; padding:0 4px; }
</style></head><body><div id="surface"></div><textarea id="keyboard" hidden autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Type on remote desktop" placeholder="Type on remote desktop"></textarea><div id="tools" aria-label="Remote keyboard and viewport controls"></div><script src="renderer.js"></script></body></html>
